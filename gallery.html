<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quartz — Student Organization</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #120f18;
  --surface: rgba(255,255,255,.10);
  --surface-dark: rgba(20,20,30,.62);
  --text: #fff7fb;
  --muted: #e7dce5;
  --accent: #c66bff;
  --accent2: #ffd1ef;
  --border: rgba(255,255,255,.20);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
}

/* Background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;

  background-image:
    linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.65)),
    url("https://scontent.fmnl17-6.fna.fbcdn.net/v/t1.15752-9/795581019_2985977885067906_2171794633061627627_n.jpg?stp=dst-jpg_s480x480_tt6&_nc_cat=103&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=0024fc&_nc_eui2=AeEqTN2yzysLx0XrywVhZX5BX4NWeFCzdUZfg1Z4ULN1RvubyXyL3gjWj1gL6_neXxD63k7DJ3bknUzkIn21R4nP&_nc_ohc=R764TswxI54Q7kNvwG6XO6n&_nc_oc=Ado_3Ncu3s9LNpbxz7P2YEfQgB0HO_Lusc8Z7RgcCcWtGeHezx52uCCNR_y_HwuOQy0&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=scontent.fmnl17-6.fna&_nc_ss=7a22e&oh=03_Q7cD6QHI2d7DW8BFF17SvYTeKy2TnMg1B1o1eSZkGMXtOpFEnQ&oe=6AC71781");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  filter: saturate(1.05);
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(10,10,20,.35);
}

/* Navigation */
.nav {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: min(1160px, 94%);
  z-index: 10;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;

  padding: 10px 16px;
  background: var(--surface-dark);
  backdrop-filter: blur(18px);

  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;

  color: var(--text);
  text-decoration: none;
  font-weight: 800;
  letter-spacing: .04em;
  white-space: nowrap;
}

.brand img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 14px;
  border: 1px solid var(--border);
}

.links {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 5px;
}

.links a {
  color: var(--text);
  text-decoration: none;
  padding: 9px 12px;
  border-radius: 12px;
  font-size: .9rem;
  font-weight: 600;
  transition: .25s ease;
}

.links a:hover {
  background: var(--accent);
  color: white;
  transform: translateY(-1px);
}

/* Main */
main {
  flex: 1;
}

/* Hero */
.hero {
  min-height: 100vh;

  display: grid;
  place-items: center;

  padding: 150px 6% 90px;
  text-align: center;
}

.hero-card {
  width: min(900px, 100%);
  padding: 55px 38px;

  background: rgba(20,20,30,.58);
  backdrop-filter: blur(14px);

  border: 1px solid var(--border);
  border-radius: 32px;

  box-shadow: 0 20px 80px rgba(0,0,0,.3);
}

.badge {
  display: inline-block;

  padding: 7px 13px;
  margin-bottom: 22px;

  border-radius: 999px;
  background: var(--accent);

  color: white;
  font-size: .8rem;
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
}

h1 {
  font-size: clamp(3rem, 8vw, 6.8rem);
  line-height: .95;
  letter-spacing: -.05em;
}

.hero-title {
  margin-bottom: 25px;
}

.hero-title .purple {
  display: block;
  margin-top: 8px;
  color: var(--accent);
}

.hero-text {
  max-width: 680px;
  margin: 0 auto;

  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.9;
}

.hero-text p {
  margin-bottom: 18px;
}

.hero-text p:last-child {
  margin-bottom: 0;
}

.btn {
  display: inline-block;

  margin-top: 30px;
  padding: 13px 20px;

  border-radius: 14px;
  background: var(--accent);

  color: white;
  text-decoration: none;
  font-weight: 800;

  transition: .25s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(198,107,255,.3);
}


section {
  padding: 100px 6%;
}

.container {
  max-width: 1160px;
  margin: auto;
}

.section-head {
  margin-bottom: 32px;
}

.kicker {
  color: var(--accent2);
  font-size: .75rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

h2 {
  margin-top: 6px;
  font-size: clamp(2rem, 4vw, 3.6rem);
  line-height: 1.1;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  padding: 24px;

  background: var(--surface);
  backdrop-filter: blur(10px);

  border: 1px solid var(--border);
  border-radius: 22px;
}

.card h3 {
  margin-bottom: 10px;
}

.muted {
  color: var(--muted);
}

/* Gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.gallery img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;

  border-radius: 18px;
  border: 1px solid var(--border);

  transition: .25s ease;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* People */
.person {
  display: flex;
  align-items: center;
  gap: 14px;
}

.avatar {
  width: 58px;
  height: 58px;

  border-radius: 50%;
  object-fit: cover;

  border: 1px solid var(--border);
}

.timeline {
  display: grid;
  gap: 14px;
}

.activity {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 18px;
  align-items: start;
}

.date {
  color: var(--accent2);
  font-weight: 900;
}


footer {
  width: 100%;
  margin-top: auto;
  padding: 35px 6%;

  text-align: center;

  color: var(--muted);
  background: rgba(10,10,20,.45);

  border-top: 1px solid var(--border);
  backdrop-filter: blur(12px);

  line-height: 1.8;
}

footer b {
  color: var(--text);
}

footer i {
  color: var(--accent2);
}


@media (max-width: 800px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .links {
    width: 100%;
    justify-content: flex-start;
  }

  .links a {
    font-size: .82rem;
    padding: 8px 10px;
  }

  .hero {
    padding-top: 200px;
  }

  .hero-card {
    padding: 42px 22px;
    border-radius: 25px;
  }

  .hero-text {
    font-size: .98rem;
    line-height: 1.8;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }

  .activity {
    grid-template-columns: 1fr;
    gap: 4px;
  }
}

@media (max-width: 480px) {

  .nav {
    width: 94%;
  }

  .brand img {
    width: 42px;
    height: 42px;
  }

  .links {
    gap: 3px;
  }

  .links a {
    padding: 7px 8px;
    font-size: .76rem;
  }

  .hero {
    padding-left: 4%;
    padding-right: 4%;
  }

  .hero-card {
    padding: 36px 18px;
  }

  section {
    padding: 75px 5%;
  }

  .gallery {
    gap: 8px;
  }
}
</style>
</head>
